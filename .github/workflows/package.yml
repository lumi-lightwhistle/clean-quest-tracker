name: Package

# Builds the add-on zip for a release tag and uploads it to GitHub Releases and CurseForge.
# Started automatically by the Release workflow; can also be run by hand from the Actions tab
# to re-upload an existing tag. Tick "dry run" to build without uploading anything.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example v0.8.5)
        required: true
        type: string
      dry_run:
        description: Build only, upload nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Use this workflow's packaging config and the tag's changelog
        run: |
          # The add-on lives in a subfolder, so the packager is pointed at it with -t.
          # The packaging config comes from the commit this workflow runs from, so fixes
          # to it also apply to older tags.
          git show "$GITHUB_SHA:.pkgmeta" > "$RUNNER_TEMP/pkgmeta.yaml"
          cp CHANGELOG.md CleanQuestTracker/CHANGELOG.md
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: -t CleanQuestTracker -m ${{ runner.temp }}/pkgmeta.yaml ${{ inputs.dry_run && '-d' || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Show what was built
        if: ${{ inputs.dry_run }}
        run: |
          find . -name '*.zip' -not -path './.git/*' | while read -r z; do echo "== $z"; unzip -l "$z"; done
