name: Package

# Builds the add-on zip for a release tag and uploads it to GitHub Releases and CurseForge.
# Started automatically by the Release workflow; can also be run by hand from the Actions tab
# to re-upload an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example v0.8.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
