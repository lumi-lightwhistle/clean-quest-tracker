name: Package

# Builds the add-on zip for a release tag and uploads it to GitHub Releases and CurseForge.
# Started automatically by the Release workflow; can also be run by hand from the Actions tab
# to re-upload an existing tag. Tick "dry run" to build without uploading anything.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example v0.8.5)
        required: true
        type: string
      dry_run:
        description: Build only, upload nothing
        required: false
        default: false
        type: boolean
      version:
        description: Version without the v, for the run name (optional, for example 0.8.5)
        required: false
        type: string

# Shows in the Actions list as, for example, "release: CleanQuestTracker-0.8.5".
run-name: "${{ inputs.dry_run && 'dry run' || 'release' }}: CleanQuestTracker-${{ inputs.version || inputs.tag }}"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Prepare packaging inputs
        id: prep
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # The packaging config always comes from the commit this workflow runs from, so
          # fixes to it also apply when an older tag is re-packaged.
          git show "$GITHUB_SHA:.github/pkgmeta.yml" > "$RUNNER_TEMP/pkgmeta.yaml"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # CurseForge shows the changelog file we upload on that file's Changelog tab. Send
          # only this version's section, not the whole history. The full history stays in
          # CHANGELOG.md on GitHub.
          ver="${TAG#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 { on = 1 }
            on && /^## / && index($0, v) == 0 { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            cp "$RUNNER_TEMP/notes.md" CHANGELOG.md
            echo "Release notes for $ver:"; cat CHANGELOG.md
          else
            echo "::warning::No section for $ver in CHANGELOG.md; uploading the whole file."
          fi

          if [ -f CleanQuestTracker.toc ]; then
            echo "top=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            # Tags up to v0.8.5 keep the add-on in a CleanQuestTracker subfolder. Stage that
            # folder as its own small repo so the packager finds the .toc at the root.
            stage="$RUNNER_TEMP/stage"
            mkdir "$stage"
            cp -a CleanQuestTracker/. "$stage/"
            cp CHANGELOG.md "$stage/CHANGELOG.md"
            cd "$stage"
            git init -q
            git add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "$TAG"
            git tag "$TAG"
            echo "top=$stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          # Zip: CleanQuestTracker-0.8.5.zip. CurseForge label: CleanQuestTracker-0.8.5.zip
          args: -t ${{ steps.prep.outputs.top }} -m ${{ runner.temp }}/pkgmeta.yaml -n "{package-name}-${{ steps.prep.outputs.version }}:{package-name}-${{ steps.prep.outputs.version }}.zip" ${{ inputs.dry_run && '-d' || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the zip to the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # The packager only uploads to GitHub when it can see the repository, which the
          # staged build for older tags hides, so attach the zip here in every case.
          zip=$(find . "$RUNNER_TEMP/stage" -path '*/.release/*.zip' 2>/dev/null | head -n 1)
          [ -n "$zip" ] || { echo "::error::No zip was built"; exit 1; }
          gh release upload "$TAG" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $(basename "$zip") to $TAG"
      - name: Show what was built
        if: ${{ inputs.dry_run }}
        run: |
          find . "$RUNNER_TEMP/stage" -name '*.zip' -not -path './.git/*' 2>/dev/null | while read -r z; do echo "== $z"; unzip -l "$z"; done
