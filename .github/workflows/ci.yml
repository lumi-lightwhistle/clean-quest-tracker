name: CI

# Runs once per pull request event. All three jobs are required checks on main, so nothing
# reaches main untested; CI does not run again after the merge.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Structural Lua check
        run: |
          status=0
          for f in $(git ls-files '*.lua' ':!tools/*'); do
            echo "== $f"
            python tools/luacheck.py "$f" > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; status=1; }
          done
          exit $status
      - name: Every file in the .toc exists, and every Lua file is in the .toc
        run: |
          # The .toc uses Windows-style paths (Tracker\Zones.lua); compare with forward slashes.
          grep -E '\.lua[[:space:]]*$' CleanQuestTracker.toc | tr -d '\r' | tr '\\' '/' | sort > /tmp/toc.txt
          # tests/ (offline tests) and Dev/ (the in-game self-test add-on) are not part of the add-on.
          git ls-files '*.lua' ':!tools/*' ':!tests/*' ':!Dev/*' | sort > /tmp/files.txt
          status=0
          comm -23 /tmp/toc.txt /tmp/files.txt | sed 's/^/listed in the .toc but missing: /' | grep . && status=1
          comm -13 /tmp/toc.txt /tmp/files.txt | sed 's/^/not listed in the .toc: /' | grep . && status=1
          exit $status

  # The offline regression tests (tests/run.lua): the add-on's own Lua, loaded in .toc order on a stand-in WoW API.
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.1 (the game's Lua version)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Every tests/test_*.lua is listed in SUITES in tests/run.lua
        run: |
          status=0
          for f in tests/test_*.lua; do
            grep -q "\"$(basename "$f")\"" tests/run.lua || { echo "not in SUITES in tests/run.lua: $f"; status=1; }
          done
          exit $status
      - name: Run the offline tests
        run: lua5.1 tests/run.lua

  # Squash-merged PR titles become the commit message, which drives the changelog.
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
