name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Structural Lua check
        run: |
          status=0
          for f in CleanQuestTracker/*.lua; do
            echo "== $f"
            python tools/luacheck.py "$f" > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; status=1; }
          done
          exit $status
      - name: Every file in the .toc exists
        run: |
          grep -E '^[A-Za-z0-9_]+\.lua' CleanQuestTracker/CleanQuestTracker.toc | tr -d '\r' | while read -r f; do
            test -f "CleanQuestTracker/$f" || { echo "missing: $f"; exit 1; }
          done
