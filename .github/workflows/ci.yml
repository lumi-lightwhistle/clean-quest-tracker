name: CI

# Runs once per pull request event. Both jobs are required checks on main, so nothing
# reaches main untested; CI does not run again after the merge.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Structural Lua check
        run: |
          status=0
          for f in *.lua; do
            echo "== $f"
            python tools/luacheck.py "$f" > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; status=1; }
          done
          exit $status
      - name: Every file in the .toc exists
        run: |
          grep -E '^[A-Za-z0-9_]+\.lua' CleanQuestTracker.toc | tr -d '\r' | while read -r f; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

  # Squash-merged PR titles become the commit message, which drives the changelog.
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
