name: Release

# On every push to main, release-please keeps a "Release PR" open that holds the next version
# and changelog. Merging that PR tags the release, then this workflow starts "Package" for
# that tag, which zips the add-on and uploads it to GitHub Releases and CurseForge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The packager refuses to run from a branch push when HEAD has a tag, so it is started
      # as its own workflow run (workflow_dispatch is allowed for the built-in token).
      - name: Start Package workflow for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run package.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f version="${TAG#v}"
